spring.application.name=baozi-store
server.port=8080

# Banco H2 em arquivo (os dados ficam salvos entre reinicializacoes)
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Datas no formato yyyy-MM-dd no JSON
spring.jackson.serialization.write-dates-as-timestamps=false
